[package]
name = "mori"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A minimal, musical vector animation studio"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rfd = "0.15"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
