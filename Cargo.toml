[package]
name = "mori"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A minimal, musical vector animation studio"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rfd = "0.15"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version="0.3",default-features=false,features=["std","NSEvent","block2","NSApplication","NSResponder","NSMenu","NSMenuItem"] }
block2 = "0.6"

objc2-foundation = { version="0.3",default-features=false,features=["std","NSObject","NSString","NSArray","NSLocale"] }
